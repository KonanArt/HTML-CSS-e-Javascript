<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Filmes</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>
<body class="bg-light">

  <!-- MENU -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">🎬 Cinema</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="cadastro-filmes.html">Cadastro de Filmes</a></li>
          <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Cadastro de Salas</a></li>
          <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Cadastro de Sessões</a></li>
          <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Venda de Ingressos</a></li>
          <li class="nav-item"><a class="nav-link" href="sessoes.html">Sessões Disponíveis</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- FORMULÁRIO -->
  <div class="container mt-4">
    <h2>Cadastro de Filmes</h2>
    <form id="formFilme" class="mt-3">

      <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" id="titulo" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <textarea id="descricao" class="form-control" rows="3" required></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Gênero</label>
        <select id="genero" class="form-select" required>
          <option value="">Selecione...</option>
          <option>Ação</option>
          <option>Comédia</option>
          <option>Drama</option>
          <option>Romance</option>
          <option>Suspense</option>
          <option>Terror</option>
          <option>Animação</option>
          <option>Aventura</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Classificação Indicativa</label>
        <select id="classificacao" class="form-select" required>
          <option value="">Selecione...</option>
          <option>Livre</option>
          <option>10 anos</option>
          <option>12 anos</option>
          <option>14 anos</option>
          <option>16 anos</option>
          <option>18 anos</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Duração (minutos)</label>
        <input type="number" id="duracao" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Data de Estreia</label>
        <input type="date" id="dataEstreia" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary">Salvar Filme</button>

    </form>
  </div>

  <script src="./js/popper.min.js"></script>
  <script src="./js/bootstrap.min.js"></script>
  <script src="./manipulacao/filmes.js"></script>
</body>
</html>
