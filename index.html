<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>
<body>

    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand text-white" href="#">Cadastro de Alunos</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-3">Formulário de Cadastro</h2>
        <form id="formAluno" class="row g-3">
            <div class="col-md-6">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" required>
            </div>
            <div class="col-md-3">
                <label for="idade" class="form-label">Idade</label>
                <input type="number" class="form-control" id="idade" required min="0">
            </div>
            <div class="col-md-3">
                <label for="curso" class="form-label">Curso</label>
                <select class="form-select" id="curso" required>
                    <option value="">Selecione...</option>
                    <option>JavaScript</option>
                    <option>Python</option>
                    <option>Java</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="nota" class="form-label">Nota Final</label>
                <input type="number" class="form-control" id="nota" required min="0" max="10" step="0.1">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary" onclick="">Cadastrar</button>
                <button type="reset" class="btn btn-secondary">Limpar</button>

            </div>
        </form>

        <hr>

        <h3>Lista de Alunos</h3>
        <table class="table table-striped mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Curso</th>
                    <th>Nota Final</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaAlunos">
                <!-- Linhas serão inseridas aqui -->
            </tbody>
        </table>
        <hr>

        <h3>Relatórios</h3>
        <div class="mt-3">
            <button id="btnAprovados" class="btn btn-success me-2">Listar Aprovados</button>
            <button id="btnMediaNotas" class="btn btn-primary me-2">Média das Notas</button>
            <button id="btnMediaIdades" class="btn btn-info me-2">Média das Idades</button>
            <button id="btnOrdemAlfabetica" class="btn btn-secondary me-2">Nomes em Ordem Alfabética</button>
            <button id="btnPorCurso" class="btn btn-dark">Qtd por Curso</button>
        </div>

        <div id="relatorios" class="mt-4 p-3 border rounded bg-light">
            <h5>Resultados:</h5>
            <ul id="saidaRelatorios"></ul>
        </div>

    </div>

    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/eventos.js"></script>

</body>
</html>
