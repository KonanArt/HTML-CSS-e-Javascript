<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Funcionários</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="text-center mb-4">Cadastro de Funcionários</h1>

      <!-- Formulário -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <form id="formFuncionario" class="row g-3">
            <input type="hidden" id="indiceEdicao" value="" />

            <div class="col-md-6">
              <label for="nome" class="form-label">Nome</label>
              <input
                type="text"
                id="nome"
                class="form-control"
                placeholder="Digite o nome"
                required
              />
            </div>

            <div class="col-md-3">
              <label for="idade" class="form-label">Idade</label>
              <input
                type="number"
                id="idade"
                class="form-control"
                placeholder="Ex: 25"
                required
              />
            </div>

            <div class="col-md-3">
              <label for="cargo" class="form-label">Cargo</label>
              <input
                type="text"
                id="cargo"
                class="form-control"
                placeholder="Ex: Desenvolvedor"
                required
              />
            </div>

            <div class="col-md-4">
              <label for="salario" class="form-label">Salário</label>
              <input
                type="number"
                id="salario"
                class="form-control"
                placeholder="Ex: 5000"
                required
              />
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary" id="btnCadastrar">
                Cadastrar
              </button>
              <button
                type="button"
                class="btn btn-success d-none"
                id="btnSalvarEdicao"
              >
                Salvar Alteração
              </button>
              <button
                type="button"
                class="btn btn-secondary d-none"
                id="btnCancelarEdicao"
              >
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Tabela -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-3">Lista de Funcionários</h4>
          <table class="table table-bordered table-striped text-center">
            <thead class="table-dark">
              <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário (R$)</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tbodyFuncionarios">
              <!-- Linhas geradas dinamicamente -->
            </tbody>
          </table>
        </div>
      </div>
      <!-- Botões de Relatórios -->
      <div class="card shadow-sm mt-4">
        <div class="card-body">
          <h4 class="mb-3">Relatórios</h4>
          <button class="btn btn-outline-primary me-2" id="btnSalarioMaior">
            Salário > 5000
          </button>
          <button class="btn btn-outline-success me-2" id="btnMediaSalarial">
            Média Salarial
          </button>
          <button class="btn btn-outline-warning me-2" id="btnCargosUnicos">
            Cargos Únicos
          </button>
          <button class="btn btn-outline-dark" id="btnNomesMaiusculo">
            Nomes em Maiúsculo
          </button>
        </div>
      </div>

      <!-- Modal de Relatórios -->
      <div class="modal fade" id="modalRelatorio" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitulo">Relatório</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body" id="modalCorpo"></div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./manipulacao/manipulaDados.js"></script>
  </body>
</html>
