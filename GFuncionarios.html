<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciamento de Funcionarios</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="text-center mb-4">Cadastro de Funcionários</h1>

      <!-- Formulário -->
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <form id="formFuncionario" class="row g-3">
            <div class="col-md-6">
              <label for="nome" class="form-label">Nome</label>
              <input
                type="text"
                id="nome"
                class="form-control"
                placeholder="Digite o nome"
                required
              />
            </div>

            <div class="col-md-3">
              <label for="idade" class="form-label">Idade</label>
              <input
                type="number"
                id="idade"
                class="form-control"
                placeholder="Ex: 25"
                required
              />
            </div>

            <div class="col-md-3">
              <label for="cargo" class="form-label">Cargo</label>
              <input
                type="text"
                id="cargo"
                class="form-control"
                placeholder="Ex: Desenvolvedor"
                required
              />
            </div>

            <div class="col-md-4">
              <label for="salario" class="form-label">Salário</label>
              <input
                type="number"
                id="salario"
                class="form-control"
                placeholder="Ex: 5000"
                required
              />
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-primary">Cadastrar</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Tabela de Funcionários -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-3">Lista de Funcionários</h4>
          <table
            class="table table-bordered table-striped"
            id="tabelaFuncionarios"
          >
            <thead class="table-dark">
              <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cargo</th>
                <th>Salário (R$)</th>
              </tr>
            </thead>
            <tbody id="tbodyFuncionarios">
              <!-- Funcionários cadastrados aparecerão aqui -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./manipulacao/manipulaDados.js"></script>
  </body>
</html>
